<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>FOGSLY</h2>
        <p>Redirecting you to the password reset page...</p>
    </div>

    <script>
        // Extract parameters from Firebase URL
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const oobCode = urlParams.get('oobCode');
        const apiKey = urlParams.get('apiKey');
        const lang = urlParams.get('lang');

        // Define your custom domain here
        const CUSTOM_DOMAIN = 'https://fogsly.com'; // Always use production domain

        // Handle different authentication modes
        if (mode === 'resetPassword' && oobCode) {
            // Redirect to custom password reset page
            const redirectUrl = `${CUSTOM_DOMAIN}/reset-password?oobCode=${oobCode}`;
            console.log('Redirecting to:', redirectUrl);
            window.location.href = redirectUrl;
        } else if (mode === 'verifyEmail' && oobCode) {
            // Handle email verification (you can implement this later)
            const redirectUrl = `${CUSTOM_DOMAIN}/verify-email?oobCode=${oobCode}`;
            console.log('Redirecting to:', redirectUrl);
            window.location.href = redirectUrl;
        } else if (mode === 'recoverEmail' && oobCode) {
            // Handle email recovery (you can implement this later)
            const redirectUrl = `${CUSTOM_DOMAIN}/recover-email?oobCode=${oobCode}`;
            console.log('Redirecting to:', redirectUrl);
            window.location.href = redirectUrl;
        } else {
            // Fallback: redirect to auth page
            console.log('Unknown mode or missing parameters, redirecting to auth');
            window.location.href = `${CUSTOM_DOMAIN}/auth`;
        }

        // Fallback timeout in case redirect doesn't work
        setTimeout(() => {
            if (!document.hidden) {
                alert('Redirect failed. Please navigate to the FOGSLY website manually.');
                window.location.href = CUSTOM_DOMAIN;
            }
        }, 5000);
    </script>
</body>
</html>
