<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0818" />
      <stop offset="60%" stop-color="#1f1638" />
      <stop offset="100%" stop-color="#3d2138" />
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="1" />
      <stop offset="60%" stop-color="#f77f00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f77f00" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#nightSky)" />
  <!-- Arches in background -->
  <path d="M 50,360 L 50,180 A 100,100 0 0,1 250,180 L 250,360 Z" fill="#130e24" opacity="0.7" />
  <path d="M 350,360 L 350,180 A 100,100 0 0,1 550,180 L 550,360 Z" fill="#130e24" opacity="0.7" />
  <path d="M 180,360 L 180,140 A 120,120 0 0,1 420,140 L 420,360 Z" fill="#26173c" opacity="0.8" />
  <!-- Center Glow -->
  <circle cx="300" cy="180" r="140" fill="url(#lanternGlow)" />
  <!-- Hanging Lanterns -->
  <line x1="120" y1="0" x2="120" y2="80" stroke="#d4af37" stroke-width="1.5" />
  <polygon points="110,80 130,80 125,115 115,115" fill="#fca311" />
  <circle cx="120" cy="95" r="15" fill="url(#lanternGlow)" />
  <line x1="480" y1="0" x2="480" y2="90" stroke="#d4af37" stroke-width="1.5" />
  <polygon points="470,90 490,90 485,125 475,125" fill="#fca311" />
  <circle cx="480" cy="105" r="15" fill="url(#lanternGlow)" />
  <!-- Typography -->
  <text x="300" y="105" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#e0a96d" text-anchor="middle" letter-spacing="3">DASTAAN EVENTS LAYYAH PRESENTS</text>
  <text x="300" y="185" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="52" fill="#ffd166" text-anchor="middle" letter-spacing="1">Qawali Night</text>
  <text x="300" y="235" font-family="'Cinzel', serif" font-weight="700" font-size="16" fill="#fdf0d5" text-anchor="middle" letter-spacing="5">AN EVENING OF SUFI ECSTASY</text>
</svg>
