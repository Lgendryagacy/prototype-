
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
    
    <defs>
      <!-- Ground Ambient Shadows -->
      <radialGradient id="ambFloorShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#020617" stop-opacity="0.38" />
        <stop offset="45%" stop-color="#090D1A" stop-opacity="0.18" />
        <stop offset="75%" stop-color="#0F172A" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
      </radialGradient>

      <!-- Glass Highlight -->
      <linearGradient id="glassGloss" x1="0%" y1="0%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25" />
        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>

      <!-- Gold 3D Material -->
      <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFBEB" />
        <stop offset="20%" stop-color="#FDE047" />
        <stop offset="50%" stop-color="#EAB308" />
        <stop offset="85%" stop-color="#CA8A04" />
        <stop offset="100%" stop-color="#854D0E" />
      </linearGradient>

      <linearGradient id="goldEdge" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#713F12" />
        <stop offset="40%" stop-color="#A16207" />
        <stop offset="70%" stop-color="#EAB308" />
        <stop offset="100%" stop-color="#FEF08A" />
      </linearGradient>

      <!-- Royal Blue 3D Material -->
      <linearGradient id="blue3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#60A5FA" />
        <stop offset="30%" stop-color="#2563EB" />
        <stop offset="70%" stop-color="#1D4ED8" />
        <stop offset="100%" stop-color="#0F2870" />
      </linearGradient>

      <!-- Deep Purple 3D Material -->
      <linearGradient id="purple3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#C084FC" />
        <stop offset="30%" stop-color="#8B5CF6" />
        <stop offset="70%" stop-color="#6D28D9" />
        <stop offset="100%" stop-color="#3B0764" />
      </linearGradient>

      <!-- Emerald 3D Material -->
      <linearGradient id="emerald3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#6EE7B7" />
        <stop offset="35%" stop-color="#10B981" />
        <stop offset="75%" stop-color="#047857" />
        <stop offset="100%" stop-color="#064E3B" />
      </linearGradient>

      <!-- Platinum / Chrome Material -->
      <linearGradient id="chrome3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="30%" stop-color="#E2E8F0" />
        <stop offset="60%" stop-color="#94A3B8" />
        <stop offset="85%" stop-color="#CBD5E1" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>

      <!-- Soft Drop Shadow Filter -->
      <filter id="soft3dShadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.25" />
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.15" />
      </filter>

      <!-- Glowing Filter for Accents -->
      <filter id="glowGleam" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  

    <!-- Ambient Shadow -->
    <ellipse cx="256" cy="450" rx="160" ry="28" fill="url(#ambFloorShadow)" />

    <!-- Glowing Holographic Energy Base Ring -->
    <ellipse cx="256" cy="430" rx="130" ry="22" fill="none" stroke="#38BDF8" stroke-width="5" opacity="0.6" filter="url(#glowGleam)" />
    <ellipse cx="256" cy="430" rx="90" ry="15" fill="none" stroke="#818CF8" stroke-width="3" opacity="0.8" />

    <!-- Floating Neural Sparkle Accents -->
    <g transform="translate(110, 140) scale(1.1)" filter="url(#glowGleam)">
      <path d="M0 -22 C0 -6 6 0 22 0 C6 0 0 6 0 22 C0 6 -6 0 -22 0 C-6 0 0 -6 0 -22 Z" fill="#38BDF8" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    </g>
    <g transform="translate(405, 170) scale(1)" filter="url(#glowGleam)">
      <path d="M0 -20 C0 -5 5 0 20 0 C5 0 0 5 0 20 C0 5 -5 0 -20 0 C-5 0 0 -5 0 -20 Z" fill="#A855F7" />
    </g>

    <!-- Main Robot Floating Body -->
    <g transform="translate(256, 240)" filter="url(#soft3dShadow)">
      
      <!-- Top Antenna / Hologram Emitter Crown -->
      <g transform="translate(0, -165)">
        <rect x="-8" y="10" width="16" height="35" rx="8" fill="url(#chrome3d)" stroke="#475569" stroke-width="2" />
        <circle cx="0" cy="0" r="18" fill="#0284C7" stroke="#38BDF8" stroke-width="3" filter="url(#glowGleam)" />
        <circle cx="0" cy="0" r="9" fill="#E0F2FE" />
      </g>

      <!-- Side Magnetic Levitation Ear Pods -->
      <!-- Left Ear -->
      <g transform="translate(-165, -10)">
        <ellipse cx="0" cy="0" rx="20" ry="42" fill="#0C2356" />
        <ellipse cx="4" cy="0" rx="16" ry="38" fill="url(#blue3dGrad)" stroke="#93C5FD" stroke-width="2" />
        <circle cx="4" cy="0" r="10" fill="#38BDF8" filter="url(#glowGleam)" />
        <circle cx="4" cy="0" r="4" fill="#FFFFFF" />
      </g>

      <!-- Right Ear -->
      <g transform="translate(165, -10)">
        <ellipse cx="0" cy="0" rx="20" ry="42" fill="#0C2356" />
        <ellipse cx="-4" cy="0" rx="16" ry="38" fill="url(#blue3dGrad)" stroke="#93C5FD" stroke-width="2" />
        <circle cx="-4" cy="0" r="10" fill="#38BDF8" filter="url(#glowGleam)" />
        <circle cx="-4" cy="0" r="4" fill="#FFFFFF" />
      </g>

      <!-- Main Ceramic Pearl Spherical Head / Torso Shell -->
      <!-- Rear Volume Gradient -->
      <radialGradient id="ceramicHead" cx="38%" cy="28%" r="72%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="35%" stop-color="#F1F5F9" />
        <stop offset="70%" stop-color="#CBD5E1" />
        <stop offset="90%" stop-color="#94A3B8" />
        <stop offset="100%" stop-color="#475569" />
      </radialGradient>
      
      <circle cx="0" cy="0" r="150" fill="url(#ceramicHead)" stroke="#FFFFFF" stroke-width="4" />

      <!-- Curved Gloss Obsidian Visor Screen -->
      <g>
        <!-- Visor Bezel / Rim -->
        <rect x="-115" y="-65" width="230" height="130" rx="60" fill="#030712" stroke="url(#chrome3d)" stroke-width="3" />
        
        <!-- Visor Glass Deep Void -->
        <rect x="-110" y="-60" width="220" height="120" rx="55" fill="#0B132B" />

        <!-- Friendly Glowing Electric Cyan Eyes (^_^) -->
        <!-- Left Eye (Happy Arc) -->
        <g filter="url(#glowGleam)">
          <path d="M-68 8 C-68 -16 -32 -16 -32 8" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" fill="none" />
          <path d="M-68 8 C-68 -16 -32 -16 -32 8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
        </g>

        <!-- Right Eye (Happy Arc) -->
        <g filter="url(#glowGleam)">
          <path d="M32 8 C32 -16 68 -16 68 8" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" fill="none" />
          <path d="M32 8 C32 -16 68 -16 68 8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
        </g>

        <!-- Cute Cyan Blush Spots -->
        <ellipse cx="-72" cy="22" rx="10" ry="5" fill="#38BDF8" opacity="0.4" filter="url(#glowGleam)" />
        <ellipse cx="72" cy="22" rx="10" ry="5" fill="#38BDF8" opacity="0.4" filter="url(#glowGleam)" />

        <!-- Visor Glass Curved Specular Glint -->
        <path d="M-90 -45 C-50 -60 50 -60 90 -45 C50 -52 -50 -52 -90 -45 Z" fill="#FFFFFF" opacity="0.65" />
      </g>

      <!-- Chest Emblem Badge -->
      <g transform="translate(0, 95)">
        <circle cx="0" cy="0" r="22" fill="url(#blue3dGrad)" stroke="#93C5FD" stroke-width="2" />
        <!-- AI Sparkle Icon -->
        <path d="M0 -12 C0 -3 3 0 12 0 C3 0 0 3 0 12 C0 3 -3 0 -12 0 C-3 0 0 -3 0 -12 Z" fill="#FFFFFF" />
      </g>

      <!-- Bottom Rim Ambient Glow -->
      <path d="M-95 115 C-40 145 40 145 95 115" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    </g>
  </svg>
  