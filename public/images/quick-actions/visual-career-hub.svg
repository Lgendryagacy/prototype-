
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
    
    <defs>
      <!-- Ground Ambient Shadows -->
      <radialGradient id="ambFloorShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#020617" stop-opacity="0.38" />
        <stop offset="45%" stop-color="#090D1A" stop-opacity="0.18" />
        <stop offset="75%" stop-color="#0F172A" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
      </radialGradient>

      <!-- Glass Highlight -->
      <linearGradient id="glassGloss" x1="0%" y1="0%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25" />
        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>

      <!-- Gold 3D Material -->
      <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFBEB" />
        <stop offset="20%" stop-color="#FDE047" />
        <stop offset="50%" stop-color="#EAB308" />
        <stop offset="85%" stop-color="#CA8A04" />
        <stop offset="100%" stop-color="#854D0E" />
      </linearGradient>

      <linearGradient id="goldEdge" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#713F12" />
        <stop offset="40%" stop-color="#A16207" />
        <stop offset="70%" stop-color="#EAB308" />
        <stop offset="100%" stop-color="#FEF08A" />
      </linearGradient>

      <!-- Royal Blue 3D Material -->
      <linearGradient id="blue3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#60A5FA" />
        <stop offset="30%" stop-color="#2563EB" />
        <stop offset="70%" stop-color="#1D4ED8" />
        <stop offset="100%" stop-color="#0F2870" />
      </linearGradient>

      <!-- Deep Purple 3D Material -->
      <linearGradient id="purple3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#C084FC" />
        <stop offset="30%" stop-color="#8B5CF6" />
        <stop offset="70%" stop-color="#6D28D9" />
        <stop offset="100%" stop-color="#3B0764" />
      </linearGradient>

      <!-- Emerald 3D Material -->
      <linearGradient id="emerald3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#6EE7B7" />
        <stop offset="35%" stop-color="#10B981" />
        <stop offset="75%" stop-color="#047857" />
        <stop offset="100%" stop-color="#064E3B" />
      </linearGradient>

      <!-- Platinum / Chrome Material -->
      <linearGradient id="chrome3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="30%" stop-color="#E2E8F0" />
        <stop offset="60%" stop-color="#94A3B8" />
        <stop offset="85%" stop-color="#CBD5E1" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>

      <!-- Soft Drop Shadow Filter -->
      <filter id="soft3dShadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.25" />
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.15" />
      </filter>

      <!-- Glowing Filter for Accents -->
      <filter id="glowGleam" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  
    
    <!-- Floor Ambient Shadow -->
    <ellipse cx="256" cy="440" rx="190" ry="34" fill="url(#ambFloorShadow)" />
    
    <!-- Background Floating 3D Sparkle -->
    <g transform="translate(380, 100) scale(1.1)" filter="url(#glowGleam)">
      <path d="M0 -22 C0 -6 6 0 22 0 C6 0 0 6 0 22 C0 6 -6 0 -22 0 C-6 0 0 -6 0 -22 Z" fill="url(#goldLight)" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    </g>
    <g transform="translate(90, 220) scale(0.7)" filter="url(#glowGleam)">
      <path d="M0 -22 C0 -6 6 0 22 0 C6 0 0 6 0 22 C0 6 -6 0 -22 0 C-6 0 0 -6 0 -22 Z" fill="#60A5FA" />
    </g>

    <!-- Main 3D Briefcase Body with 3D Depth Layering -->
    <g filter="url(#soft3dShadow)">
      <!-- Back Extrusion / Darker Rear Volume -->
      <rect x="92" y="160" width="328" height="230" rx="42" fill="#0C2356" />

      <!-- Top Chrome Handle -->
      <path d="M196 160 C196 90 316 90 316 160" stroke="#0F2870" stroke-width="26" stroke-linecap="round" fill="none" />
      <path d="M196 156 C196 94 316 94 316 156" stroke="url(#chrome3d)" stroke-width="18" stroke-linecap="round" fill="none" />
      <path d="M206 153 C206 102 306 102 306 153" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />

      <!-- Chrome Handle Brackets -->
      <rect x="180" y="146" width="32" height="28" rx="8" fill="url(#chrome3d)" stroke="#334155" stroke-width="2" />
      <rect x="300" y="146" width="32" height="28" rx="8" fill="url(#chrome3d)" stroke="#334155" stroke-width="2" />

      <!-- Main Front Clay Body -->
      <rect x="96" y="166" width="320" height="220" rx="38" fill="url(#blue3dGrad)" stroke="#93C5FD" stroke-width="2.5" stroke-opacity="0.6" />

      <!-- Top Curvature Specular Rim -->
      <path d="M120 174 C160 170 352 170 392 174 C410 180 410 200 392 204 C352 196 160 196 120 204 C102 200 102 180 120 174 Z" fill="url(#glassGloss)" opacity="0.65" />

      <!-- Front Center Tech Glass Console Display -->
      <rect x="136" y="210" width="240" height="135" rx="22" fill="#030C22" stroke="url(#chrome3d)" stroke-width="2.5" />
      <rect x="138" y="212" width="236" height="131" rx="20" fill="#071942" fill-opacity="0.85" />

      <!-- Holographic Career Growth Wave inside Display -->
      <path d="M152 305 Q190 295 220 265 T290 250 T356 230" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
      <path d="M152 305 Q190 295 220 265 T290 250 T356 230 L356 320 L152 320 Z" fill="url(#emerald3dGrad)" opacity="0.25" />
      
      <!-- Spark Dot at Apex -->
      <circle cx="356" cy="230" r="8" fill="#34D399" filter="url(#glowGleam)" />
      <circle cx="356" cy="230" r="4" fill="#FFFFFF" />

      <!-- Verified 3D Badge on Glass -->
      <g transform="translate(175, 245)">
        <circle cx="0" cy="0" r="16" fill="url(#goldLight)" stroke="#FFFBEB" stroke-width="2" />
        <path d="M-6 0 L-2 4 L6 -4" stroke="#713F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Metrics Holographic Text Bars -->
      <rect x="205" y="238" width="80" height="8" rx="4" fill="#60A5FA" opacity="0.9" />
      <rect x="205" y="252" width="55" height="6" rx="3" fill="#93C5FD" opacity="0.6" />

      <!-- Front Metallic Clasps / Locks -->
      <rect x="150" y="195" width="28" height="34" rx="7" fill="url(#goldLight)" stroke="#FFFBEB" stroke-width="1.5" />
      <circle cx="164" cy="214" r="3.5" fill="#713F12" />

      <rect x="334" y="195" width="28" height="34" rx="7" fill="url(#goldLight)" stroke="#FFFBEB" stroke-width="1.5" />
      <circle cx="348" cy="214" r="3.5" fill="#713F12" />

      <!-- Lower Edge Bevel Highlight -->
      <path d="M130 380 Q256 388 382 380" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    </g>

    <!-- Floating 3D Verified Check Pill (Top Right) -->
    <g transform="translate(365, 140) rotate(8)" filter="url(#soft3dShadow)">
      <rect x="-45" y="-20" width="90" height="40" rx="20" fill="url(#emerald3dGrad)" stroke="#A7F3D0" stroke-width="2.5" />
      <circle cx="-22" cy="0" r="11" fill="#FFFFFF" />
      <path d="M-26 0 L-23 3 L-18 -3" stroke="#047857" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <rect x="-6" y="-4" width="38" height="8" rx="4" fill="#FFFFFF" />
    </g>
  </svg>
  