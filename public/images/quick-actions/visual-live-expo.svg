
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
    
    <defs>
      <!-- Ground Ambient Shadows -->
      <radialGradient id="ambFloorShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#020617" stop-opacity="0.38" />
        <stop offset="45%" stop-color="#090D1A" stop-opacity="0.18" />
        <stop offset="75%" stop-color="#0F172A" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
      </radialGradient>

      <!-- Glass Highlight -->
      <linearGradient id="glassGloss" x1="0%" y1="0%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25" />
        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>

      <!-- Gold 3D Material -->
      <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFBEB" />
        <stop offset="20%" stop-color="#FDE047" />
        <stop offset="50%" stop-color="#EAB308" />
        <stop offset="85%" stop-color="#CA8A04" />
        <stop offset="100%" stop-color="#854D0E" />
      </linearGradient>

      <linearGradient id="goldEdge" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#713F12" />
        <stop offset="40%" stop-color="#A16207" />
        <stop offset="70%" stop-color="#EAB308" />
        <stop offset="100%" stop-color="#FEF08A" />
      </linearGradient>

      <!-- Royal Blue 3D Material -->
      <linearGradient id="blue3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#60A5FA" />
        <stop offset="30%" stop-color="#2563EB" />
        <stop offset="70%" stop-color="#1D4ED8" />
        <stop offset="100%" stop-color="#0F2870" />
      </linearGradient>

      <!-- Deep Purple 3D Material -->
      <linearGradient id="purple3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#C084FC" />
        <stop offset="30%" stop-color="#8B5CF6" />
        <stop offset="70%" stop-color="#6D28D9" />
        <stop offset="100%" stop-color="#3B0764" />
      </linearGradient>

      <!-- Emerald 3D Material -->
      <linearGradient id="emerald3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#6EE7B7" />
        <stop offset="35%" stop-color="#10B981" />
        <stop offset="75%" stop-color="#047857" />
        <stop offset="100%" stop-color="#064E3B" />
      </linearGradient>

      <!-- Platinum / Chrome Material -->
      <linearGradient id="chrome3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="30%" stop-color="#E2E8F0" />
        <stop offset="60%" stop-color="#94A3B8" />
        <stop offset="85%" stop-color="#CBD5E1" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>

      <!-- Soft Drop Shadow Filter -->
      <filter id="soft3dShadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.25" />
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.15" />
      </filter>

      <!-- Glowing Filter for Accents -->
      <filter id="glowGleam" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  

    <!-- Ambient Floor Shadow -->
    <ellipse cx="256" cy="445" rx="195" ry="34" fill="url(#ambFloorShadow)" />

    <!-- Background 3D Stadium Stage Rings -->
    <ellipse cx="256" cy="425" rx="170" ry="24" fill="#2E1065" stroke="#7C3AED" stroke-width="4" opacity="0.6" />
    <ellipse cx="256" cy="415" rx="140" ry="20" fill="#4C1D95" stroke="#A855F7" stroke-width="3" opacity="0.8" />
    <ellipse cx="256" cy="405" rx="110" ry="16" fill="url(#purple3dGrad)" stroke="#C084FC" stroke-width="2" />

    <!-- Floating Confetti & Sparkles -->
    <g transform="translate(100, 110) scale(1.1)" filter="url(#glowGleam)">
      <path d="M0 -20 C0 -5 5 0 20 0 C5 0 0 5 0 20 C0 5 -5 0 -20 0 C-5 0 0 -5 0 -20 Z" fill="#F43F5E" />
    </g>
    <g transform="translate(420, 130) scale(1.2)" filter="url(#glowGleam)">
      <path d="M0 -22 C0 -6 6 0 22 0 C6 0 0 6 0 22 C0 6 -6 0 -22 0 C-6 0 0 -6 0 -22 Z" fill="url(#goldLight)" />
    </g>
    <circle cx="390" cy="220" r="5" fill="#38BDF8" filter="url(#glowGleam)" />
    <circle cx="110" cy="260" r="6" fill="#FBBF24" filter="url(#glowGleam)" />

    <!-- 3D Expo Calendar Pass (Behind Mic) -->
    <g transform="translate(130, 120) rotate(-7)" filter="url(#soft3dShadow)">
      <!-- Back Extrusion -->
      <rect x="0" y="0" width="220" height="260" rx="32" fill="#2E1065" />
      <!-- Main Glass Card -->
      <rect x="4" y="4" width="212" height="252" rx="28" fill="#581C87" stroke="#C084FC" stroke-width="2" />
      <!-- Header Banner -->
      <path d="M4 32 C4 16 16 4 32 4 L188 4 C204 4 216 16 216 32 L216 75 L4 75 Z" fill="url(#purple3dGrad)" />
      <!-- Binder Rings -->
      <circle cx="50" cy="38" r="10" fill="url(#chrome3d)" stroke="#1E1B4B" stroke-width="2" />
      <circle cx="110" cy="38" r="10" fill="url(#chrome3d)" stroke="#1E1B4B" stroke-width="2" />
      <circle cx="170" cy="38" r="10" fill="url(#chrome3d)" stroke="#1E1B4B" stroke-width="2" />
      
      <!-- Date Display -->
      <text x="110" y="165" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">28</text>
      <text x="110" y="195" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#DDD6FE" text-anchor="middle" letter-spacing="4">OCTOBER</text>
      <!-- Gold Star on Badge -->
      <g transform="translate(110, 226) scale(0.9)">
        <polygon points="0,-12 3.5,-3 12,-3 5,2 8,11 0,6 -8,11 -5,2 -12,-3 -3.5,-3" fill="url(#goldLight)" stroke="#FEF08A" stroke-width="1.5" />
      </g>
    </g>

    <!-- Main 3D Studio Microphone (Foreground Centered) -->
    <g transform="translate(265, 140) rotate(12)" filter="url(#soft3dShadow)">
      <!-- Mic Stand / Heavy Extruded Base -->
      <ellipse cx="25" cy="270" rx="60" ry="18" fill="#1E1B4B" />
      <ellipse cx="25" cy="265" rx="55" ry="15" fill="url(#chrome3d)" stroke="#475569" stroke-width="2" />
      
      <!-- Center Stem -->
      <rect x="18" y="180" width="14" height="90" rx="7" fill="url(#chrome3d)" stroke="#334155" stroke-width="1.5" />
      
      <!-- U-Shaped Cradle Arm -->
      <path d="M-35 110 C-35 195 85 195 85 110" stroke="#0F172A" stroke-width="18" stroke-linecap="round" fill="none" />
      <path d="M-35 110 C-35 190 85 190 85 110" stroke="url(#chrome3d)" stroke-width="12" stroke-linecap="round" fill="none" />
      <!-- Cradle Swivel Screws -->
      <circle cx="-35" cy="110" r="10" fill="url(#goldLight)" stroke="#713F12" stroke-width="2" />
      <circle cx="85" cy="110" r="10" fill="url(#goldLight)" stroke="#713F12" stroke-width="2" />

      <!-- Microphone Capsule (Outer Capsule Body) -->
      <rect x="-15" y="10" width="80" height="140" rx="40" fill="#3B0764" />
      
      <!-- Lower Body (Glossy Purple Handle) -->
      <path d="M-15 70 L65 70 L65 110 C65 132 47 150 25 150 C3 150 -15 132 -15 110 Z" fill="url(#purple3dGrad)" stroke="#C084FC" stroke-width="2" />
      
      <!-- Golden Accent Ring / Collar -->
      <rect x="-17" y="65" width="84" height="10" rx="5" fill="url(#goldLight)" stroke="#FFFBEB" stroke-width="1.5" />

      <!-- Top Microphone Metal Mesh Grill -->
      <path d="M-15 70 L65 70 L65 50 C65 28 47 10 25 10 C3 10 -15 28 -15 50 Z" fill="url(#chrome3d)" stroke="#CBD5E1" stroke-width="2" />
      
      <!-- Mesh Texture Pattern lines -->
      <path d="M-5 25 Q25 45 55 25" stroke="#475569" stroke-width="2" fill="none" opacity="0.6" />
      <path d="M-10 42 Q25 62 60 42" stroke="#475569" stroke-width="2" fill="none" opacity="0.6" />
      <path d="M-12 58 Q25 78 62 58" stroke="#475569" stroke-width="2" fill="none" opacity="0.6" />
      <line x1="25" y1="10" x2="25" y2="70" stroke="#475569" stroke-width="2" opacity="0.6" />
      <line x1="8" y1="18" x2="8" y2="70" stroke="#475569" stroke-width="1.5" opacity="0.6" />
      <line x1="42" y1="18" x2="42" y2="70" stroke="#475569" stroke-width="1.5" opacity="0.6" />

      <!-- Specular Highlight Curve on Grill -->
      <path d="M-2 20 C10 15 35 15 48 20 C35 25 10 25 -2 20 Z" fill="#FFFFFF" opacity="0.75" />

      <!-- Pulsing Red Live Broadcast Dot -->
      <g transform="translate(25, 95)">
        <circle cx="0" cy="0" r="10" fill="#EF4444" opacity="0.4" filter="url(#glowGleam)" />
        <circle cx="0" cy="0" r="5" fill="#EF4444" stroke="#FECACA" stroke-width="1.5" />
      </g>
    </g>

    <!-- Floating 3D LIVE Badge (Top Left) -->
    <g transform="translate(130, 95) rotate(-5)" filter="url(#soft3dShadow)">
      <rect x="-42" y="-18" width="84" height="36" rx="18" fill="#EF4444" stroke="#FCA5A5" stroke-width="2.5" />
      <circle cx="-20" cy="0" r="5" fill="#FFFFFF" />
      <text x="6" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">LIVE</text>
    </g>
  </svg>
  