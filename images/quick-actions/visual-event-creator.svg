<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Ambient Glow -->
    <radialGradient id="creatorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Squircle Card Gradient -->
    <linearGradient id="creatorCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="40%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>

    <!-- Inner Purple Icon Tile (Glossy 3D Purple Button) -->
    <linearGradient id="creatorTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="35%" stop-color="#4f28d9" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Specular Highlight for Tile -->
    <linearGradient id="creatorTileGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Card Soft Depth Shadow -->
    <filter id="creatorCardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f28d9" flood-opacity="0.1" />
    </filter>

    <!-- Inner Tile Depth Shadow -->
    <filter id="creatorTileShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3b0764" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Card -->
  <circle cx="120" cy="120" r="105" fill="url(#creatorGlow)" />

  <!-- Outer 3D Soft Squircle Container Card -->
  <g filter="url(#creatorCardShadow)">
    <rect x="22" y="20" width="196" height="196" rx="46" fill="url(#creatorCardGrad)" stroke="#e9d5ff" stroke-width="1.8" />
    <!-- Inner Top Specular Rim Reflection -->
    <path d="M40 22 C28 22 24 28 24 44 L24 90 C45 80 90 75 140 75 C185 75 210 82 216 90 L216 44 C216 28 206 22 196 22 Z" fill="#ffffff" fill-opacity="0.6" />
  </g>

  <!-- Central 3D Purple Glossy Icon Tile -->
  <g filter="url(#creatorTileShadow)">
    <rect x="74" y="64" width="92" height="90" rx="28" fill="url(#creatorTileGrad)" stroke="#c084fc" stroke-width="1.2" />
    <!-- Tile Gloss Overlay -->
    <rect x="75" y="65" width="90" height="42" rx="26" fill="url(#creatorTileGloss)" />
    
    <!-- Calendar Icon (White) -->
    <!-- Calendar Body -->
    <rect x="92" y="90" width="56" height="46" rx="10" stroke="#ffffff" stroke-width="4.2" fill="none" />
    
    <!-- Top Spiral Ring Posts -->
    <line x1="104" y1="84" x2="104" y2="92" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
    <line x1="136" y1="84" x2="136" y2="92" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
    
    <!-- Header Line inside Calendar -->
    <line x1="92" y1="104" x2="148" y2="104" stroke="#ffffff" stroke-width="3.2" opacity="0.8" />
    
    <!-- Dot Grid / Marker -->
    <circle cx="108" cy="118" r="2.2" fill="#ffffff" />
    <circle cx="120" cy="118" r="2.2" fill="#ffffff" />
    <circle cx="132" cy="118" r="2.2" fill="#ffffff" />
    <circle cx="108" cy="126" r="2.2" fill="#ffffff" opacity="0.7" />
    <circle cx="120" cy="126" r="2.2" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Typography Label: "Event Creator" -->
  <text x="120" y="185" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#4F28D9" letter-spacing="-0.01em">Event Creator</text>
</svg>
