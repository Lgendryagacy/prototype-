<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ambient Glow -->
    <radialGradient id="hiringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Squircle Card Gradient -->
    <linearGradient id="hiringCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <!-- Inner Blue Icon Tile (Glossy 3D Blue Button) -->
    <linearGradient id="hiringTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="35%" stop-color="#0052ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Specular Highlight for Tile -->
    <linearGradient id="hiringTileGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Card Soft Depth Shadow -->
    <filter id="hiringCardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0052ff" flood-opacity="0.1" />
    </filter>

    <!-- Inner Tile Depth Shadow -->
    <filter id="hiringTileShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Card -->
  <circle cx="120" cy="120" r="105" fill="url(#hiringGlow)" />

  <!-- Outer 3D Soft Squircle Container Card -->
  <g filter="url(#hiringCardShadow)">
    <rect x="22" y="20" width="196" height="196" rx="46" fill="url(#hiringCardGrad)" stroke="#bae6fd" stroke-width="1.8" />
    <!-- Inner Top Specular Rim Reflection -->
    <path d="M40 22 C28 22 24 28 24 44 L24 90 C45 80 90 75 140 75 C185 75 210 82 216 90 L216 44 C216 28 206 22 196 22 Z" fill="#ffffff" fill-opacity="0.6" />
  </g>

  <!-- Central 3D Blue Glossy Icon Tile -->
  <g filter="url(#hiringTileShadow)">
    <rect x="74" y="64" width="92" height="90" rx="28" fill="url(#hiringTileGrad)" stroke="#93c5fd" stroke-width="1.2" />
    <!-- Tile Gloss Overlay -->
    <rect x="75" y="65" width="90" height="42" rx="26" fill="url(#hiringTileGloss)" />
    
    <!-- Plus in Circle Icon (White) -->
    <circle cx="120" cy="109" r="23" stroke="#ffffff" stroke-width="4.2" fill="none" />
    <!-- Plus symbol lines -->
    <line x1="120" y1="96" x2="120" y2="122" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
    <line x1="107" y1="109" x2="133" y2="109" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
  </g>

  <!-- Typography Label: "Hiring Portal" -->
  <text x="120" y="185" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0052FF" letter-spacing="-0.01em">Hiring Portal</text>
</svg>
