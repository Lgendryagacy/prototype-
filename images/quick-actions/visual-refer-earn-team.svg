
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
    
    <defs>
      <!-- Ground Ambient Shadows -->
      <radialGradient id="ambFloorShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#020617" stop-opacity="0.38" />
        <stop offset="45%" stop-color="#090D1A" stop-opacity="0.18" />
        <stop offset="75%" stop-color="#0F172A" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
      </radialGradient>

      <!-- Glass Highlight -->
      <linearGradient id="glassGloss" x1="0%" y1="0%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25" />
        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>

      <!-- Gold 3D Material -->
      <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFBEB" />
        <stop offset="20%" stop-color="#FDE047" />
        <stop offset="50%" stop-color="#EAB308" />
        <stop offset="85%" stop-color="#CA8A04" />
        <stop offset="100%" stop-color="#854D0E" />
      </linearGradient>

      <linearGradient id="goldEdge" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#713F12" />
        <stop offset="40%" stop-color="#A16207" />
        <stop offset="70%" stop-color="#EAB308" />
        <stop offset="100%" stop-color="#FEF08A" />
      </linearGradient>

      <!-- Royal Blue 3D Material -->
      <linearGradient id="blue3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#60A5FA" />
        <stop offset="30%" stop-color="#2563EB" />
        <stop offset="70%" stop-color="#1D4ED8" />
        <stop offset="100%" stop-color="#0F2870" />
      </linearGradient>

      <!-- Deep Purple 3D Material -->
      <linearGradient id="purple3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#C084FC" />
        <stop offset="30%" stop-color="#8B5CF6" />
        <stop offset="70%" stop-color="#6D28D9" />
        <stop offset="100%" stop-color="#3B0764" />
      </linearGradient>

      <!-- Emerald 3D Material -->
      <linearGradient id="emerald3dGrad" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#6EE7B7" />
        <stop offset="35%" stop-color="#10B981" />
        <stop offset="75%" stop-color="#047857" />
        <stop offset="100%" stop-color="#064E3B" />
      </linearGradient>

      <!-- Platinum / Chrome Material -->
      <linearGradient id="chrome3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="30%" stop-color="#E2E8F0" />
        <stop offset="60%" stop-color="#94A3B8" />
        <stop offset="85%" stop-color="#CBD5E1" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>

      <!-- Soft Drop Shadow Filter -->
      <filter id="soft3dShadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.25" />
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.15" />
      </filter>

      <!-- Glowing Filter for Accents -->
      <filter id="glowGleam" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  

    <!-- Ambient Shadow -->
    <ellipse cx="256" cy="445" rx="190" ry="32" fill="url(#ambFloorShadow)" />

    <!-- Connecting Dimensional Energy Arcs -->
    <g filter="url(#glowGleam)">
      <!-- Arc Left to Center -->
      <path d="M140 310 Q200 240 256 210" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M140 310 Q200 240 256 210" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Arc Right to Center -->
      <path d="M372 310 Q312 240 256 210" stroke="#C084FC" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M372 310 Q312 240 256 210" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Bottom Base Arc -->
      <path d="M140 320 Q256 360 372 320" stroke="#34D399" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75" />
    </g>

    <!-- Floating Gold Reward Coins on Arcs -->
    <g transform="translate(195, 260) scale(0.6)" filter="url(#soft3dShadow)">
      <circle cx="0" cy="0" r="30" fill="url(#goldLight)" stroke="#FEF08A" stroke-width="2" />
      <text x="0" y="9" font-family="sans-serif" font-size="28" font-weight="900" fill="#713F12" text-anchor="middle">F</text>
    </g>
    <g transform="translate(317, 260) scale(0.6)" filter="url(#soft3dShadow)">
      <circle cx="0" cy="0" r="30" fill="url(#goldLight)" stroke="#FEF08A" stroke-width="2" />
      <text x="0" y="9" font-family="sans-serif" font-size="28" font-weight="900" fill="#713F12" text-anchor="middle">F</text>
    </g>
    <g transform="translate(256, 345) scale(0.7)" filter="url(#soft3dShadow)">
      <circle cx="0" cy="0" r="30" fill="url(#goldLight)" stroke="#FEF08A" stroke-width="2" />
      <text x="0" y="9" font-family="sans-serif" font-size="28" font-weight="900" fill="#713F12" text-anchor="middle">F</text>
    </g>

    <!-- Left 3D Avatar (Emerald/Teal Innovator) -->
    <g transform="translate(140, 280)" filter="url(#soft3dShadow)">
      <!-- Head Sphere -->
      <circle cx="0" cy="-35" r="38" fill="url(#emerald3dGrad)" stroke="#A7F3D0" stroke-width="3" />
      <path d="M-20 -55 C-5 -65 15 -65 25 -50 C10 -58 -10 -58 -20 -55 Z" fill="#FFFFFF" opacity="0.6" />
      <!-- Torso Capsule -->
      <path d="M-45 45 C-45 10 -25 -2 0 -2 C25 -2 45 10 45 45 Z" fill="url(#emerald3dGrad)" stroke="#A7F3D0" stroke-width="3" />
    </g>

    <!-- Right 3D Avatar (Purple/Violet Creator) -->
    <g transform="translate(372, 280)" filter="url(#soft3dShadow)">
      <!-- Head Sphere -->
      <circle cx="0" cy="-35" r="38" fill="url(#purple3dGrad)" stroke="#DDD6FE" stroke-width="3" />
      <path d="M-20 -55 C-5 -65 15 -65 25 -50 C10 -58 -10 -58 -20 -55 Z" fill="#FFFFFF" opacity="0.6" />
      <!-- Torso Capsule -->
      <path d="M-45 45 C-45 10 -25 -2 0 -2 C25 -2 45 10 45 45 Z" fill="url(#purple3dGrad)" stroke="#DDD6FE" stroke-width="3" />
    </g>

    <!-- Center Dominant 3D Avatar (Royal Blue Leader) -->
    <g transform="translate(256, 175)" filter="url(#soft3dShadow)">
      <!-- Crown / Verified Halo -->
      <ellipse cx="0" cy="-75" rx="35" ry="10" fill="none" stroke="url(#goldLight)" stroke-width="5" filter="url(#glowGleam)" />
      
      <!-- Head Sphere -->
      <circle cx="0" cy="-38" r="48" fill="url(#blue3dGrad)" stroke="#BFDBFE" stroke-width="3.5" />
      <path d="M-25 -65 C-8 -78 18 -78 30 -60 C12 -70 -12 -70 -25 -65 Z" fill="#FFFFFF" opacity="0.65" />
      
      <!-- Torso Capsule with Tie / Lapel -->
      <path d="M-58 60 C-58 15 -32 0 0 0 C32 0 58 15 58 60 Z" fill="url(#blue3dGrad)" stroke="#BFDBFE" stroke-width="3.5" />
      <polygon points="0,5 -10,35 0,55 10,35" fill="url(#goldLight)" stroke="#FEF08A" stroke-width="1.5" />
    </g>
  </svg>
  