
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
    <defs>
      <linearGradient id="badgeRim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
        <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.6" />
      </linearGradient>
      
        <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#C084FC" />
          <stop offset="50%" stop-color="#9333EA" />
          <stop offset="100%" stop-color="#581C87" />
        </linearGradient>
      
      <filter id="badgeShadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.22" />
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.12" />
      </filter>
      <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
      </filter>
    </defs>

    <!-- Squircle Shadow -->
    <rect x="8" y="8" width="112" height="112" rx="34" fill="url(#bg)" filter="url(#badgeShadow)" stroke="url(#badgeRim)" stroke-width="2.5" />
    
    <!-- Top 3D Specular Curved Bevel -->
    <path d="M14 36 C14 20 28 12 46 12 L82 12 C100 12 114 20 114 36 C92 42 36 42 14 36 Z" fill="#FFFFFF" fill-opacity="0.45" />

    <!-- Content Icon Group -->
    <g filter="url(#iconGlow)">
      
        <!-- Mic Capsule -->
        <rect x="52" y="32" width="24" height="42" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2" />
        <path d="M42 56 C42 70 86 70 86 56" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />
        <line x1="64" y1="70" x2="64" y2="86" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <line x1="52" y1="86" x2="76" y2="86" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <!-- Sound Wave Arc -->
        <path d="M92 48 C96 54 96 62 92 68" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" fill="none" />
      
    </g>
  </svg>
  