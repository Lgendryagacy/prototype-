    /* --- MAIN CONTAINER --- */
    .timed-cards-container {
      height: 100vh;
      min-height: 650px;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background-color: var(--color-bg-primary);
    }

    /* --- BACKGROUND IMAGE --- */
    .timed-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }

    .timed-card::after {
      content: "";
      position: absolute;
      inset: 0;
      backdrop-filter: blur(3px) brightness(0.9);
    }

    /* Gradients for themes remain unchanged */
    .dark .timed-card::after {
      background: linear-gradient(90deg,
          rgba(var(--color-bg-primary-rgb, 15, 23, 36), 1) 10%,
          rgba(var(--color-bg-primary-rgb, 15, 23, 36), 0.8) 35%,
          rgba(var(--color-bg-primary-rgb, 15, 23, 36), 0) 70%);
    }

    .light .timed-card::after {
      background: linear-gradient(90deg,
          rgba(var(--color-bg-primary-rgb, 248, 250, 252), 1) 10%,
          rgba(var(--color-bg-primary-rgb, 248, 250, 252), 0.8) 35%,
          rgba(var(--color-bg-primary-rgb, 248, 250, 252), 0) 70%);
    }

    .desert .timed-card::after,
    .corporate .timed-card::after {
      background: linear-gradient(90deg,
          rgba(var(--color-bg-primary-rgb, 8, 14, 28), 1) 10%,
          rgba(var(--color-bg-primary-rgb, 8, 14, 28), 0.8) 35%,
          rgba(var(--color-bg-primary-rgb, 8, 14, 28), 0) 70%);
    }

    /* --- TEXT CONTENT AREA --- */
    .timed-card-content {
      position: relative;
      z-index: 10;
      padding-left: 3%;
      padding-right: 6%;
      max-width: 48%;
      color: var(--color-text-primary);
    }

    .content-place {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      opacity: 0.9;
    }

    .content-title {
      font-size: clamp(2.6rem, 5vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin: 0.8rem 0;
      color: var(--color-text-primary);
      text-shadow: 0 2px 25px rgba(0, 0, 0, 0.25);
    }

    .content-description {
      font-size: 1.1rem;
      color: var(--color-text-secondary);
      max-width: 480px;
      line-height: 1.7;
      margin-top: 0.5rem;
      opacity: 0.95;
    }

    .content-button {
      margin-top: 2rem;
      padding: 0.9rem 2.2rem;
      background-color: var(--color-primary);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s ease;
    }

    .content-button:hover {
      transform: translateY(-2px);
      background-color: color-mix(in srgb, var(--color-primary) 85%, black);
    }

    /* --- DETAILS / THUMBNAIL CARDS --- */
    .details-wrapper {
      position: absolute;
      right: 4%;
      bottom: 4%;
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .details-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .detail-card {
      width: 90px;
      height: 110px;
      border-radius: 14px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    }

    .detail-card.active {
      border-color: var(--color-primary);
      width: 115px;
      height: 140px;
    }

    .detail-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
      opacity: 0;
      transition: opacity 0.35s;

    }

    .detail-card:hover::after,
    .detail-card.active::after {
      opacity: 1;
    }

    .detail-card-content {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 0.75rem;
      color: white;
      transform: translateY(100%);
      transition: transform 0.35s ease;
    }

    .detail-card.active .detail-card-content,
    .detail-card:hover .detail-card-content {
      transform: translateY(0);
    }

    .detail-card-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.2;
    }

    /* --- PROGRESS BAR --- */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 260px;
    }

    .details-counter {
      font-weight: 700;
      color: var(--color-text-secondary);
      letter-spacing: 1px;
    }

    .progress-bar-background {
      flex-grow: 1;
      height: 4px;
      background-color: rgba(127, 127, 127, 0.28);
      border-radius: 3px;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--color-text-primary);
      border-radius: 3px;
    }

    /* --- MOBILE RESPONSIVE --- */
    @media (max-width: 992px) {
      .timed-card-content {
        max-width: 60%;
        padding-left: 5%;
      }
    }

    @media (max-width: 768px) {
      .timed-cards-container {
        height: 70vh;
        /* reduce height on mobile */
        min-height: 450px;
        /* smaller minimum height */
      }

      .timed-card-content {
        max-width: 100%;
        padding-left: 3%;
        /* smaller left padding */
        padding-right: 3%;
      }

      .content-title {
        font-size: clamp(1.8rem, 6vw, 2.6rem);
        /* smaller mobile title */
      }

      .details-wrapper {
        display: none;
      }
    }


    @media (max-width: 480px) {
      .timed-cards-container {
        height: 65vh;
        /* More reduction */
      }

      .timed-card-content {
        padding-left: 3%;
        padding-right: 3%;
      }
    }

      box-shadow: none;
